<title>HabitGrid</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0c10; }
</style>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
<div id="root">
  <div id="boot">loading your grid…</div>
</div>

<style>
  :root {
    --canvas: #0a0c10;
    --panel: #161b23;
    --panel-2: #1e2530;
    --hairline: #2e3745;
    --hairline-2: #44506d;
    --empty: #202836;
    --ink: #f4f7fb;
    --ink-2: #c1cad6;
    --ink-3: #8b96a5;
    --danger: #ff6b6b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --cell: 16px;
    --gap: 4px;
    --r: 3px;
  }

  #root {
    font-family: var(--mono);
    background: var(--canvas);
    color: var(--ink);
    min-height: 100vh;
    width: 100%;
    padding: 38px clamp(16px, 3.5vw, 48px) 90px;
    box-sizing: border-box;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #root *, #root *::before, #root *::after { box-sizing: border-box; }
  #boot { color: var(--ink-3); padding: 40px 0; text-align: center; }

  .wrap { max-width: min(1360px, 100%); margin: 0 auto; }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap; padding-bottom: 18px;
    border-bottom: 1px solid var(--hairline); margin-bottom: 26px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .brand .tick { color: var(--ink-3); font-size: 11px; }
  .masthead-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  button { font-family: var(--mono); font-size: 12px; cursor: pointer; }
  .btn {
    background: var(--panel); color: var(--ink-2); border: 1px solid var(--hairline);
    border-radius: 6px; padding: 7px 11px; transition: color .12s, border-color .12s, background .12s;
  }
  .btn:hover { color: var(--ink); border-color: var(--hairline-2); background: var(--panel-2); }
  .btn.primary { color: var(--ink); border-color: var(--hairline-2); }
  .btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .btn:focus-visible, .seg button:focus-visible, .cell:focus-visible, .swatch:focus-visible,
  input:focus-visible, textarea:focus-visible, .today-tile:focus-visible {
    outline: 2px solid #4f8cff; outline-offset: 2px;
  }

  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; padding: 2px; }
  .seg button { background: none; border: 0; color: var(--ink-3); padding: 5px 10px; border-radius: 4px; }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hairline-2); }

  .year-nav { display: inline-flex; align-items: center; gap: 2px; }
  .year-nav .num { min-width: 52px; text-align: center; color: var(--ink); font-variant-numeric: tabular-nums; }
  .year-nav button {
    background: none; border: 1px solid transparent; color: var(--ink-3);
    border-radius: 5px; width: 26px; height: 26px; line-height: 1;
  }
  .year-nav button:hover:not(:disabled) { color: var(--ink); border-color: var(--hairline); }
  .year-nav button:disabled { opacity: .25; cursor: default; }

  /* ---------- today strip ---------- */
  .today { margin-bottom: 30px; }
  .today-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px;
    color: var(--ink-3); font-size: 12px;
  }
  .today-head b { color: var(--ink-2); font-weight: 500; }
  .today-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .today-tile {
    display: flex; align-items: center; gap: 9px; padding: 9px 13px 9px 11px;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 8px;
    color: var(--ink-2); transition: border-color .12s, background .12s, color .12s;
    position: relative; overflow: hidden; cursor: pointer;
  }
  .today-tile:hover { border-color: var(--hairline-2); color: var(--ink); }
  .today-tile .dot {
    width: 9px; height: 9px; border-radius: 2px; flex: none;
    background: var(--empty); box-shadow: inset 0 0 0 1px var(--hairline-2);
  }
  .today-tile.on { color: var(--ink); }
  .today-tile.on .dot { box-shadow: none; }
  .today-tile .n { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 11px; }
  .today-tile.on .n { color: var(--ink-2); }

  /* ---------- habit card ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--hairline-2);
    border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .card-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .card-title .sq { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .card-title h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .card-title p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-3); }
  .card-actions { display: flex; gap: 6px; flex: none; }
  .icon-btn {
    background: none; border: 1px solid transparent; color: var(--ink-3);
    border-radius: 5px; width: 26px; height: 26px; line-height: 1; font-size: 13px;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--hairline); }

  /* ---------- grid ---------- */
  .grid-scroll { overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent; }
  .grid-scroll::-webkit-scrollbar { height: 7px; }
  .grid-scroll::-webkit-scrollbar-thumb { background: var(--hairline-2); border-radius: 4px; }
  .grid-inner { display: inline-flex; gap: 6px; }
  .daycol {
    display: grid; grid-template-rows: 15px repeat(7, var(--cell)); gap: var(--gap);
    font-size: 9.5px; color: var(--ink-3); padding-top: 0;
  }
  .daycol span { line-height: var(--cell); height: var(--cell); }
  .plot { display: flex; flex-direction: column; gap: 4px; }
  .months { display: grid; grid-auto-flow: column; height: 11px; font-size: 10px; color: var(--ink-3); position: relative; }
  .months span { position: absolute; top: 0; white-space: nowrap; }
  .weeks { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap); }
  .cell {
    width: var(--cell); height: var(--cell); border-radius: var(--r);
    background: var(--empty); border: 0; padding: 0; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .cell.void { visibility: hidden; cursor: default; }
  .cell.future { cursor: default; opacity: .35; }
  .cell.today-cell { box-shadow: inset 0 0 0 1.2px var(--ink-2); }
  .cell.pre-start {
    cursor: default; opacity: .4; background: var(--empty) !important;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 2px, transparent 2px 5px) !important;
  }
  .cell.has-num { display: flex; align-items: flex-end; justify-content: flex-end; padding: 3px 4px; }
  .cell.has-num span { font-size: 11px; color: rgba(255,255,255,.65); text-shadow: 0 1px 2px rgba(0,0,0,.7); }

  .size-year { --cell: 17px; --gap: 4px; }
  .grid-scroll.size-month { --cell: 30px; --gap: 4px; --r: 3px; overflow: hidden; }
  .size-month .grid-inner { display: flex; width: 100%; }
  .size-month .daycol { font-size: 10px; width: 14px; }
  .size-month .plot { flex: 1; min-width: 0; }
  .size-month .months { width: 100%; font-size: 10px; }
  .size-month .weeks { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .size-month .cell { width: 100%; }

  /* month view: 4 cards per row (3 on tablets, 2 on phones) */
  .cards.month { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .cards.month .card { margin: 0; padding: 12px 12px 10px; }
  .cards.month .card.editing { grid-column: 1 / -1; }
  .cards.month .card.editing .grid-scroll { max-width: 360px; }
  .cards.month .add-card { min-height: 110px; text-align: center; }
  @media (max-width: 1099px) { .cards.month { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 639px)  { .cards.month { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .grid-scroll.size-week { --cell: 36px; --gap: 5px; overflow: hidden; }
  .size-week .grid-inner { display: flex; width: 100%; }
  .size-week .daycol { font-size: 11px; width: 30px; grid-template-rows: repeat(7, var(--cell)); }
  .size-week .daycol span:first-child { display: none; }
  .size-week .months { display: none; }
  .size-week .plot { flex: 1; min-width: 0; }
  .size-week .weeks { grid-template-columns: minmax(0, 1fr); max-width: 170px; }
  .size-week .cell { width: 100%; }

  /* week view: many narrow cards per row (up to ~7 on a wide screen) */
  .cards.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-items: start; }
  .cards.week .card { margin: 0; padding: 12px 12px 10px; }
  .cards.week .card.editing { grid-column: 1 / -1; }
  .cards.week .add-card { min-height: 110px; text-align: center; }
  .cards.week .card-head { flex-direction: column; gap: 8px; }
  .cards.week .card-actions { justify-content: flex-start; }
  .cards.week .stats { gap: 12px; }

  /* ---------- footer of card ---------- */
  .card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline);
  }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat .v { font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat .k { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
  .legend { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-3); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }

  /* ---------- editor ---------- */
  .editor { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--hairline-2); display: grid; gap: 12px; }
  .field { display: grid; gap: 5px; }
  .field label { font-size: 11px; color: var(--ink-3); }
  input[type="text"], input[type="date"], textarea {
    font-family: var(--mono); font-size: 12.5px; background: var(--canvas); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 6px; padding: 8px 10px; width: 100%;
  }
  input[type="date"] { color-scheme: dark; }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--ink-3); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(255,255,255,.1); padding: 0; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 3.5px var(--ink-2); }
  .hex { width: 96px !important; text-transform: lowercase; }
  .editor-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  /* ---------- add / empty ---------- */
  .add-card {
    border: 1px dashed var(--hairline-2); background: none; color: var(--ink-3);
    border-radius: 10px; padding: 16px; width: 100%; text-align: left;
  }
  .add-card:hover { color: var(--ink); border-color: var(--ink-3); }
  .empty { border: 1px solid var(--hairline); border-radius: 10px; padding: 40px 24px; text-align: center; color: var(--ink-3); }
  .empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 14px; font-weight: 600; }

  /* ---------- data panel ---------- */
  .data-panel { margin-top: 26px; border-top: 1px solid var(--hairline); padding-top: 18px; }
  .data-panel textarea { min-height: 120px; resize: vertical; font-size: 11px; }
  .note { font-size: 11px; color: var(--ink-3); }
  .flash { font-size: 11.5px; color: var(--ink-2); min-height: 16px; }
  .save-state { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* ---------- compact (default) view: several habits per row ---------- */
  .cards.compact { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .cards.compact .card { margin: 0; padding: 12px 12px 10px; container-type: inline-size; }
  .cards.compact .card.editing { grid-column: 1 / -1; }
  .cards.compact .add-card { min-height: 110px; text-align: center; }
  @media (max-width: 1099px) { .cards.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 639px)  { .cards.compact { grid-template-columns: minmax(0, 1fr); } }

  .card-title > div { min-width: 0; }
  .compact-card .card-head { margin-bottom: 10px; gap: 8px; }
  .compact-card .card-title h2 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact-card .card-title p { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compact-card .btn { padding: 3px 8px; font-size: 11px; }
  .compact-card .card-actions { gap: 3px; align-items: center; }
  .compact-card .card-foot { margin-top: 10px; padding-top: 9px; }
  .compact-card .stats { gap: 14px; }
  .compact-card .stat .v { font-size: 13px; }
  .compact-card .stat .k { font-size: 10px; }

  /* cells scale so exactly N weeks fill the card width (no scrolling) */
  .grid-scroll.size-compact {
    --gap: 3px; --r: 2px; --cell: 11px;
    --cell: min(32px, calc((100cqw - 18px - (var(--n) - 1) * var(--gap)) / var(--n)));
    overflow: hidden;
  }
  .size-compact .daycol { font-size: 8.5px; width: 12px; }
  .size-compact .weeks { justify-content: start; grid-auto-columns: var(--cell); }
  .size-compact .plot { flex: 1; min-width: 0; }
  .size-compact .months { font-size: 9px; width: 100%; }
  .size-compact .grid-inner { display: flex; width: 100%; }

  /* ---------- reorder panel ---------- */
  .reorder { background: var(--panel); border: 1px solid var(--hairline-2); border-radius: 10px; padding: 16px; }
  .reorder-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .reorder-head b { font-weight: 600; font-size: 14px; }
  .reorder-head .hint { color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
  .reorder-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .reorder-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: var(--panel-2); border: 1px solid var(--hairline); border-radius: 8px; user-select: none;
  }
  .reorder-row .pos { width: 18px; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
  .reorder-row .grip { touch-action: none; cursor: grab; color: var(--ink-3); font-size: 18px; line-height: 1; padding: 6px 8px; margin: -6px -4px; flex: none; }
  .reorder-row .grip:hover { color: var(--ink); }
  .reorder-row .sq { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .reorder-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reorder-row .row-actions { display: flex; gap: 2px; flex: none; }
  .reorder-row .row-actions button {
    background: none; border: 1px solid transparent; color: var(--ink-2); border-radius: 5px;
    width: 30px; height: 30px; font-size: 13px; line-height: 1;
  }
  .reorder-row .row-actions button:hover:not(:disabled) { border-color: var(--hairline-2); color: var(--ink); background: var(--panel); }
  .reorder-row .row-actions button:disabled { opacity: .22; cursor: default; }
  .reorder-row .row-actions button:focus-visible, .reorder-row .grip:focus-visible { outline: 2px solid #4f8cff; outline-offset: 1px; }
  .reorder-row.dragging { border-color: var(--ink-2); box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: grabbing; position: relative; z-index: 2; }
  .reorder-row.dragging .grip { cursor: grabbing; }

  /* ---------- archive ---------- */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .icon-btn svg { display: block; }
  .badge { color: var(--ink-3); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .editor-foot .grp { display: flex; gap: 6px; flex-wrap: wrap; }

  .cards.managing .card { border-style: dashed; }
  .btn[aria-pressed="true"] { color: var(--ink); border-color: var(--hairline-2); background: var(--panel-2); }

  .drawer-overlay { position: fixed; inset: 0; background: rgba(5,7,10,.6); z-index: 50; display: flex; justify-content: flex-end; }
  .drawer {
    width: min(420px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--hairline-2);
    display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0,0,0,.45);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .drawer.enter { animation: drawer-in .18s ease-out; }
  @keyframes drawer-in { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--hairline); }

    return _bg;
  }

    var _mq = matchMedia("(prefers-color-scheme: dark)");
    var _chg = function () { _bg = null; try { if (state && state.ready) render(); } catch (e) {} };

  /* ---------- storage ---------- */
  function serialize() {
    return JSON.stringify({ v: 1, habits: state.habits, sessions: state.sessions, targets: state.targets, fcfg: state.fcfg, view: state.view, weeks: state.weeks });
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    setSaveState("saving…");
    saveTimer = setTimeout(save, 400);
  }
  function save() {
    if (memoryOnly) { setSaveState("this session only"); return; }
    try {
      localStorage.setItem(KEY, serialize());
      setSaveState("saved " + new Date().toTimeString().slice(0, 5));
    } catch (e) { setSaveState("save failed — storage blocked"); }
  }
  function setSaveState(t) {
    var el = document.getElementById("saveState");
    if (el) el.textContent = t;
  }
  function load() {
    return new Promise(function (resolve) {
      var v = null;
      try {
        localStorage.setItem(KEY + ":probe", "1");
        localStorage.removeItem(KEY + ":probe");
        v = localStorage.getItem(KEY);
      } catch (e) { memoryOnly = true; }
      resolve(v);
    });
  }

  function seed() {
    return [
      mkHabit("Reading", "20 pages or 30 minutes", "#f2994a", LAUNCH_DATE),
      mkHabit("Meditation", "10 minutes, eyes closed", "#c084fc", LAUNCH_DATE),
      mkHabit("Exercise", "Move hard enough to sweat", "#4ade80", LAUNCH_DATE),
      mkHabit("Japanese Study", "Anki reps + one lesson", "#38bdf8", LAUNCH_DATE)
    ];
  }
  function mkHabit(name, note, color, start) {
    return { id: "h" + Math.random().toString(36).slice(2, 9), name: name, note: note || "", color: color || PALETTE[0], start: start || today(), log: {} };
  }

  /* ---------- stats ---------- */
  function countFor(h, y) {
    var n = 0, total = 0;
    for (var k in h.log) { if (h.log[k] > 0) { total++; if (k.slice(0, 4) === String(y)) n++; } }
    return { year: n, all: total };
  }
  function streaks(h) {
    var keys = Object.keys(h.log).filter(function (k) { return h.log[k] > 0; }).sort();
    if (!keys.length) return { current: 0, best: 0 };
    var best = 1, run = 1;
    for (var i = 1; i < keys.length; i++) {
      var prev = parseISO(keys[i - 1]), cur = parseISO(keys[i]);
      run = Math.round((cur - prev) / 86400000) === 1 ? run + 1 : 1;
      if (run > best) best = run;
    }
    var current = 0, cursor = new Date();
    if (!h.log[iso(cursor)]) cursor = addDays(cursor, -1);
    while (h.log[iso(cursor)] > 0) { current++; cursor = addDays(cursor, -1); }
    return { current: current, best: best };
  }

  /* ---------- grid model ---------- */
  function span() {
    var end, start, now = new Date();
    if (state.view === "compact") {
      var sun = addDays(now, -now.getDay());
      var gs = addDays(sun, -(state.weeks - 1) * 7);
      return { start: gs, end: now, gridStart: gs, weeks: state.weeks };
    }
    if (state.view === "year") {
      start = new Date(state.year, 0, 1);
      end = new Date(state.year, 11, 31);
    } else if (state.view === "week") {
      start = addDays(now, -now.getDay());      // Sunday of this week
      end = addDays(start, 6);                   // Saturday of this week
    } else { // month: last ~5 weeks up to today
      end = now;
      start = addDays(end, -34);
    }
    var gridStart = addDays(start, -start.getDay());
    var weeks = Math.ceil((addDays(end, 6 - end.getDay()) - gridStart) / 86400000 / 7);
    return { start: start, end: end, gridStart: gridStart, weeks: weeks };
  }

  function buildGrid(h) {
    var s = span(), t = today(), frag = document.createElement("div");
    frag.className = "grid-inner";

    var daycol = document.createElement("div");
    daycol.className = "daycol";
    daycol.appendChild(document.createElement("span"));
    var labels = state.view === "week" ? DAY_LABELS_FULL : DAY_LABELS;
    labels.forEach(function (l) { var e = document.createElement("span"); e.textContent = l; daycol.appendChild(e); });
    frag.appendChild(daycol);

    var plot = document.createElement("div");
    plot.className = "plot";
    var colW = { year: 20, month: 29, week: 72 }[state.view] || 20;
    var months = document.createElement("div");
    months.className = "months";
    var compact = state.view === "compact";
    var pct = state.view === "month";
    months.style.width = (compact || pct) ? "100%" : (s.weeks * colW) + "px";
    var seen = -1;
    for (var w = 0; w < s.weeks; w++) {
      var d = addDays(s.gridStart, w * 7 + 6);
      if (d < s.start || d > s.end) continue;
      if (d.getMonth() !== seen) {
        seen = d.getMonth();
        var lab = document.createElement("span");
        lab.textContent = MONTHS[seen];
        lab.style.left = compact ? "calc(" + w + " * (var(--cell) + var(--gap)))"
          : pct ? "calc((100% + var(--gap)) * " + (w / s.weeks) + ")"
          : (w * colW) + "px";
        months.appendChild(lab);
      }
    }
    plot.appendChild(months);

    var weeks = document.createElement("div");
    weeks.className = "weeks";
    for (var i = 0; i < s.weeks * 7; i++) {
      var day = addDays(s.gridStart, i);
      var key = iso(day);
      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      if (day < s.start || day > s.end) {
        cell.className += " void";
        cell.tabIndex = -1;
      } else if (key < h.start) {
        cell.className += " pre-start";
        cell.tabIndex = -1;
        cell.title = "Before " + prettyDate(h.start) + " — " + h.name + " wasn't being tracked yet";
        cell.setAttribute("aria-label", cell.title);
      } else {
        var lvl = h.log[key] || 0;
        cell.style.background = levelColor(h.color, lvl);
        if (key === t) cell.className += " today-cell";
        if (key > t) cell.className += " future";
        cell.dataset.date = key;
        cell.dataset.habit = h.id;
        cell.title = prettyDate(key) + " — " + (lvl ? lvl + "×" : "nothing logged");
        cell.setAttribute("aria-label", h.name + ", " + cell.title);
        if (state.view === "week") {
          cell.className += " has-num";
          var numSpan = document.createElement("span");
          numSpan.textContent = String(day.getDate());
          cell.appendChild(numSpan);
        }
      }
      weeks.appendChild(cell);
    }
    plot.appendChild(weeks);
    frag.appendChild(plot);
    return frag;
  }

  /* ---------- reorder ---------- */
  // Reorder only touches active habits; archived ones keep their slots.
  function applyActiveOrder(order) {
    var i = 0;
    state.habits = state.habits.map(function (h) { return h.archived ? h : order[i++]; });
  }
  function moveHabit(id, to, act) {
    var order = active();
    var from = order.findIndex(function (x) { return x.id === id; });
    if (from < 0 || to < 0 || to >= order.length || to === from) return;
    var item = order.splice(from, 1)[0];
    order.splice(to, 0, item);
    applyActiveOrder(order);
    state.focusAct = { id: id, act: act };
    scheduleSave();
    render();
  }

  // Pointer Events: one code path for mouse, touch and pen. The grip itself
  // captures the pointer, so moves keep arriving even when the finger leaves it.
  function startRowDrag(e, grip, row, list) {
    if (e.button != null && e.button > 0) return;
    e.preventDefault();
    var pid = e.pointerId;
    try { grip.setPointerCapture(pid); } catch (err) {}
    row.classList.add("dragging");

    function renumber() {
      Array.prototype.forEach.call(list.children, function (r, i) { r.firstChild.textContent = String(i + 1); });
    }
    function move(ev) {
      var others = Array.prototype.filter.call(list.children, function (r) { return r !== row; });
      var before = null;
      for (var i = 0; i < others.length; i++) {
        var r = others[i].getBoundingClientRect();
        if (ev.clientY < r.top + r.height / 2) { before = others[i]; break; }
      }
      if (before) { if (row.nextSibling !== before) list.insertBefore(row, before); }
      else if (list.lastChild !== row) list.appendChild(row);
      renumber();
      if (ev.clientY < 70) window.scrollBy(0, -14);
      else if (ev.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
    }
    function end() {
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", end);
      grip.removeEventListener("pointercancel", end);
      try { grip.releasePointerCapture(pid); } catch (err) {}
      row.classList.remove("dragging");
      var order = Array.prototype.map.call(list.children, function (r) { return r.dataset.id; });
      var cur = active();
      var changed = order.some(function (id, i) { return cur[i].id !== id; });
      if (changed) {
        var byId = {};
        cur.forEach(function (h) { byId[h.id] = h; });
        applyActiveOrder(order.map(function (id) { return byId[id]; }));
        scheduleSave();
      }
      render();
    }
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", end);
    grip.addEventListener("pointercancel", end);
  }

  function windowCount(h) {
    var s = span(), a = iso(s.start), b = iso(s.end), n = 0;
    for (var k in h.log) { if (h.log[k] > 0 && k >= a && k <= b) n++; }
    return n;
  }

  /* ----- dashboard ----- */
  function sessionsIn(range) {
    var from = range ? iso(addDays(new Date(), -(range - 1))) : "0000-00-00";
    return state.sessions.filter(function (s) { return s.date >= from; });
  }
  function sumSecs(arr) { return arr.reduce(function (a, s) { return a + s.secs; }, 0); }

  function svgEl(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function chartEl(rows, top, days) {
    var W = 600, H = 96;
    var keys = [], idx = {};
    for (var i = 0; i < days; i++) {
      var k = iso(addDays(new Date(), -(days - 1 - i)));
      keys.push(k); idx[k] = i;
    }
    var total = keys.map(function () { return 0; });
    var per = {};
    top.forEach(function (t) { per[t.id] = keys.map(function () { return 0; }); });
    rows.forEach(function (s) {
      var j = idx[s.date];
      if (j == null) return;
      total[j] += s.secs / 60;
      if (per[s.tid]) per[s.tid][j] += s.secs / 60;
    });
    var maxv = Math.max.apply(null, total.concat([1]));
    function X(i) { return (i * W / (days - 1)).toFixed(1); }
    function Y(v) { return (H - 5 - (v / maxv) * (H - 14)).toFixed(1); }

    var wrap = el("div", "chartwrap");
    var svg = svgEl("svg", { "class": "chart", viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none", role: "img", "aria-label": "Daily minutes over the last " + days + " days" });
    svg.appendChild(svgEl("path", { "class": "gl", d: "M0," + (H / 2) + " L" + W + "," + (H / 2) }));
    var area = "M0," + H + " " + total.map(function (v, i) { return "L" + X(i) + "," + Y(v); }).join(" ") + " L" + W + "," + H + " Z";
    svg.appendChild(svgEl("path", { d: area, fill: "rgba(255,255,255,.06)", stroke: "none" }));
    top.forEach(function (t) {
      var vals = per[t.id];
      if (!vals.some(function (v) { return v > 0; })) return;
      svg.appendChild(svgEl("polyline", {
        points: vals.map(function (v, i) { return X(i) + "," + Y(v); }).join(" "),
        fill: "none", stroke: t.info.color, "stroke-width": "1.7",
        "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke"
      }));
    });
    wrap.appendChild(svg);
    var ax = el("div", "chart-axis");
    ax.appendChild(el("span", null, md(keys[0])));
    ax.appendChild(el("span", null, "peak " + fmtDur(maxv * 60) + " / day"));
    ax.appendChild(el("span", null, "today"));
    wrap.appendChild(ax);
    return wrap;
  }

  function weekStart(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var wd = (x.getDay() + 6) % 7; // Monday = 0
    return addDays(x, -wd);
  }

    } catch (e) {}
  }
  function bkSave() { try { localStorage.setItem(BKEY, JSON.stringify(bk)); } catch (e) {} }

  function idb(run) {
    return new Promise(function (res, rej) {
      if (typeof indexedDB === "undefined") { rej(new Error("no indexedDB")); return; }
      var r = indexedDB.open("habitgrid-backup", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () {
        var db = r.result, tx = db.transaction("kv", "readwrite"), out;
        tx.oncomplete = function () { db.close(); res(out && out.result); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
        out = run(tx.objectStore("kv"));
      };
    });
  }

  function bkDue() { if (isDemo()) return false; return Date.now() - bk.last >= BK_DAYS * 86400000 && Date.now() >= bk.snooze; }
  function bkDaysAgo() { return Math.floor((Date.now() - bk.last) / 86400000); }
  function backupJSON() { return JSON.stringify(JSON.parse(serialize()), null, 2); }

  async function bkWrite(dir) {
    var name = "habitgrid-backup-" + today() + ".json";
    var fh = await dir.getFileHandle(name, { create: true });
    var w = await fh.createWritable();
    await w.write(backupJSON());
    await w.close();
    var names = [];
    for await (var ent of dir.entries()) {
      if (/^habitgrid-backup-\d{4}-\d{2}-\d{2}\.json$/.test(ent[0])) names.push(ent[0]);
    }
    names.sort();
    while (names.length > BK_KEEP) await dir.removeEntry(names.shift());
    return name;
  }
  function bkDone(msg) {
    bk.last = Date.now(); bk.done = true; bk.snooze = 0; bkSave();
    bkUI.msg = msg; bkUI.err = false; bkUI.needAllow = false;
  }
  async function bkBackupNow(gesture) {
    if (bkUI.busy) return false;
    bkUI.busy = true;
    try {
      if (bk.on && bkHandle) {
        var perm = await bkHandle.queryPermission({ mode: "readwrite" });
        if (perm !== "granted" && gesture) perm = await bkHandle.requestPermission({ mode: "readwrite" });
        if (perm !== "granted") { bkUI.needAllow = true; return false; }
        var name = await bkWrite(bkHandle);
        bkDone("Saved " + name + " to “" + bk.folder + "”.");
      } else {
        var fname = "habitgrid-backup-" + today() + ".json";
        dl(backupJSON(), fname, "application/json");
        bkDone("Downloaded " + fname + ".");
      }
      return true;
    } catch (e) {
      bkUI.err = true;
      bkUI.msg = "Backup failed: " + (e && e.message ? e.message : e) + ". Try choosing the folder again.";
      return false;
    } finally {
      bkUI.busy = false;
      render();
    }
  }
  async function bkChoose() {
    try {
      var h = await window.showDirectoryPicker({ id: "habitgrid-backup", mode: "readwrite" });
      await idb(function (st) { return st.put(h, "dir"); });
      bkHandle = h; bk.on = true; bk.folder = h.name; bkSave();
      await bkBackupNow(true);
    } catch (e) {
      if (e && e.name === "AbortError") return;
      bkUI.err = true;
      bkUI.msg = "Couldn't use that folder (" + (e && e.message ? e.message : e) + "). Create a new empty folder, such as HabitGrid Backups, and pick that.";
      render();
    }
  }
  async function bkStop() {
    bk.on = false; bk.folder = ""; bkHandle = null; bkUI.needAllow = false; bkSave();
    try { await idb(function (st) { return st.delete("dir"); }); } catch (e) {}
    bkUI.msg = "Folder backup is off. You'll get a weekly reminder to download a copy instead."; bkUI.err = false;
    render();
  }
  async function bkAuto() {
    if (bkUI.busy || !bkDue()) return;
    if (bk.on && bkHandle) await bkBackupNow(false);
    else render();
  }
  function backupInit() {
    bkLoad();
    if (!bk.last) { bk.last = Date.now(); bkSave(); }
    var ready = Promise.resolve();
    if (bk.on && bkSupported) {
      ready = idb(function (st) { return st.get("dir"); }).then(function (h) { bkHandle = h || null; if (!h) { bk.on = false; bkSave(); } }).catch(function () { bk.on = false; });
    } else if (bk.on) { bk.on = false; }
    ready.then(bkAuto);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) bkAuto(); });
  }

  function backupBanner() {
    if (!bkDue()) return null;
    var b = el("div", "bk-banner");
    b.setAttribute("role", "status");
    var days = bkDaysAgo();
    var t = bkUI.needAllow
      ? "Weekly backup is due. Allow access to “" + bk.folder + "” to save it."
      : (bk.on ? "Weekly backup is due." : "It's been " + days + " days since your last backup.");
    b.appendChild(el("span", "bk-t", t));
    var act = el("div", "bk-a");
    var go = el("button", "btn primary", bk.on ? (bkUI.needAllow ? "Allow & back up" : "Back up now") : "Download backup");
    go.type = "button";
    go.onclick = function () { bkBackupNow(true); };
    var later = el("button", "btn", "Later");
    later.type = "button";
    later.title = "Remind me tomorrow";
    later.onclick = function () { bk.snooze = Date.now() + 86400000; bkSave(); render(); };
    act.appendChild(go); act.appendChild(later);
    b.appendChild(act);
    return b;
  }

  function backupButton() {
    var b = el("button", "btn ico" + (bkUI.open ? " open" : "") + (bk.on ? " on" : ""));
    b.type = "button";
    b.innerHTML = ICON_FOLDERCOG + '<i class="dot"></i>';
    var label = bk.on ? "Auto-backup folder: " + bk.folder : "Set up weekly auto-backup";
    b.title = label;
    b.setAttribute("aria-label", label);
    b.setAttribute("aria-expanded", bkUI.open);
    b.onclick = function () { bkUI.open = !bkUI.open; render(); };
    return b;
  }

  function backupPanel() {
    if (!bkUI.open) return null;
    var p = el("div", "bk-panel");
    p.appendChild(el("div", "bk-h", "Weekly auto-backup"));
    var st = el("div", "bk-line");
    st.appendChild(el("span", "k", "Folder"));
    st.appendChild(el("span", null, bk.on ? bk.folder : (bkSupported ? "not set" : "not available in this browser")));
    p.appendChild(st);
    var ls = el("div", "bk-line");
    ls.appendChild(el("span", "k", "Last backup"));
    ls.appendChild(el("span", null, bk.done ? new Date(bk.last).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + " (" + bkDaysAgo() + "d ago)" : "never"));
    p.appendChild(ls);

    var acts = el("div", "bk-btns");
    if (bkSupported) {
      var ch = el("button", "btn", bk.on ? "Change folder" : "Choose folder");
      ch.type = "button"; ch.onclick = bkChoose;
      acts.appendChild(ch);
    }
    var now = el("button", "btn", bk.on ? "Back up now" : "Download backup now");
    now.type = "button"; now.disabled = bkUI.busy;
    now.onclick = function () { bkBackupNow(true); };
    acts.appendChild(now);
    if (bk.on) {
      var off = el("button", "btn danger", "Turn off");
      off.type = "button"; off.onclick = bkStop;
      acts.appendChild(off);
    }
    p.appendChild(acts);

    if (bkUI.msg) { var m = el("div", "bk-msg" + (bkUI.err ? " err" : ""), bkUI.msg); p.appendChild(m); }
    p.appendChild(el("div", "note", bkSupported
      ? "Every 7 days, when you open the app, a file named habitgrid-backup-DATE.json is saved into the folder you pick. The newest " + BK_KEEP + " are kept. Your browser may ask you to allow access once per session. Pick a new, empty folder."
      : "This browser (Safari, Firefox, iPhone) can't write to a folder. You'll get a reminder every 7 days to download a copy, and you can save it to Files or iCloud Drive. For fully automatic folder backups, open the app in Chrome or Edge on a computer."));
    return p;
  }

  /* ---------- demo mode: open index.html?demo for a lived-in grid (nothing is saved) ---------- */
  var demoRaw = null;
  function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }
  // demo on: ?demo / #demo, or when previewed inside a frame (file preview, embeds) with nothing saved or storage blocked
  function isDemo() {
    var q = ""; try { q = location.search + location.hash; } catch (e) {}
    return /[?&#]demo\b/.test(q) || (inFrame() && (memoryOnly || !demoRaw));
  }
  function demoData() {
    var seedN = 20261119;
    function rnd() { seedN |= 0; seedN = seedN + 0x6D2B79F5 | 0; var t = Math.imul(seedN ^ seedN >>> 15, 1 | seedN); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
    var now = new Date(), todayKey = iso(now);
    // p: chance per weekday (Sun..Sat), grow: how much more consistent it gets over time, streak: forced run ending yesterday
    var specs = [
      { name: "Reading", note: "20 pages or 30 minutes", color: "#f2994a", age: 160, p: [.8,.75,.8,.75,.8,.7,.85], grow: .12, streak: 11, today: 2, bias: [.15,.35,.35,.15] },
      { name: "Meditation", note: "10 minutes, eyes closed", color: "#c084fc", age: 150, p: [.7,.65,.6,.65,.6,.55,.75], grow: .2, streak: 6, today: 1, bias: [.7,.2,.07,.03] },
      { name: "Exercise", note: "Move hard enough to sweat", color: "#4ade80", age: 155, p: [.3,.8,.55,.8,.5,.75,.55], grow: .08, streak: 0, today: 0, bias: [.2,.35,.3,.15] },
      { name: "Japanese Study", note: "Anki reps + one lesson", color: "#38bdf8", age: 112, p: [.55,.9,.85,.9,.8,.7,.5], grow: .1, streak: 3, today: 0, bias: [.25,.4,.25,.1] }
    ];
    function pickLvl(b) { var r = rnd(), a = 0; for (var i = 0; i < b.length; i++) { a += b[i]; if (r < a) return i + 1; } return 1; }
    var habits = specs.map(function (sp, hi) {
      var h = { id: "demo-h" + hi, name: sp.name, note: sp.note, color: sp.color, start: iso(addDays(now, -sp.age)), log: {} };
      for (var d = sp.age; d >= 1; d--) {
        var day = addDays(now, -d), prog = 1 - d / sp.age;
        var chance = Math.min(.97, sp.p[day.getDay()] * (1 - sp.grow) + sp.grow * prog + sp.grow * .6 * prog);
        // a couple of "off" weeks so the grid has texture
        var wk = Math.floor(d / 7);
        if (wk === 6 + hi || wk === 14 + hi) chance *= .25;
        if (rnd() < chance) h.log[iso(day)] = pickLvl(sp.bias);
        if (d <= sp.streak) h.log[iso(day)] = h.log[iso(day)] || pickLvl(sp.bias);
      }
      if (sp.streak === 0) delete h.log[iso(addDays(now, -1))]; // keep non-streak habits honest
      if (sp.today) h.log[todayKey] = sp.today;
      return h;
    });
    var targets = [
      { id: "demo-t1", name: "Side project", kind: "long", color: "#818cf8", done: false },
      { id: "demo-t2", name: "File taxes", kind: "short", color: "#e8c547", done: false }
    ];
    var plan = [
      ["demo-h0", 0, 32, "pomodoro", "Chapter 9"], ["demo-h0", 1, 41, "stopwatch", ""], ["demo-h0", 2, 28, "manual", "Train ride"],
      ["demo-h0", 4, 36, "stopwatch", "Finished part two"], ["demo-h0", 6, 22, "manual", ""],
      ["demo-h3", 0, 25, "pomodoro", "Kanji set 14"], ["demo-h3", 1, 35, "stopwatch", "Lesson + Anki"], ["demo-h3", 3, 20, "pomodoro", ""],
      ["demo-h3", 5, 45, "stopwatch", "Listening practice"],
      ["demo-t1", 0, 75, "stopwatch", "Auth flow"], ["demo-t1", 2, 90, "pomodoro", "Refactor grid render"], ["demo-t1", 3, 60, "stopwatch", ""],
      ["demo-t1", 5, 110, "stopwatch", "Ship header redesign"], ["demo-t1", 7, 50, "manual", ""],
      ["demo-t2", 2, 40, "manual", "Gather receipts"], ["demo-t2", 4, 30, "stopwatch", ""]
    ];
    var info = {}; habits.forEach(function (h) { info[h.id] = { n: h.name, c: h.color, k: "long" }; });
    targets.forEach(function (t) { info[t.id] = { n: t.name, c: t.color, k: t.kind }; });
    var sessions = plan.map(function (r, i) {
      var day = addDays(now, -r[1]), ti = info[r[0]];
      return { id: "demo-s" + i, tid: r[0], date: iso(day), secs: r[2] * 60, mode: r[3], note: r[4], ts: day.getTime() + (9 + (i % 9)) * 3600000, tname: ti.n, tcolor: ti.c, tkind: ti.k };
    });
    return { habits: habits, targets: targets, sessions: sessions };
  }

  /* ---------- boot ---------- */
  load().then(function (raw) {
    demoRaw = raw;
    if (isDemo()) {
      var dd = demoData();
      memoryOnly = true;
      document.documentElement.classList.add("demo");
      state.habits = dd.habits; state.targets = dd.targets; state.sessions = dd.sessions;
      state.ready = true;
      timerInit();
      render();
      return;
    }
    if (raw) {
      try {
        var d = JSON.parse(raw);
        state.habits = Array.isArray(d.habits) ? d.habits : seed();
        if (VIEWS.indexOf(d.view) > -1) state.view = d.view;
        if (WEEK_OPTIONS.indexOf(d.weeks) > -1) state.weeks = d.weeks;
        if (Array.isArray(d.sessions)) state.sessions = d.sessions;
        if (Array.isArray(d.targets)) state.targets = d.targets;
        if (d.fcfg && typeof d.fcfg === 'object') state.fcfg = { link: d.fcfg.link !== false, min: clampInt(d.fcfg.min, 1, 240, 20) };
      } catch (e) { state.habits = seed(); }
    } else {
      state.habits = seed();
      if (!memoryOnly) save();
    }
    state.ready = true;
    timerInit();
    backupInit();
    render();
  });
})();
</script>
